<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Syncthesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/themes/classic.min.css">
<link rel="stylesheet" href="tema.css">
</head>
<body>
<div id="aviso-demo" class="demo" hidden>Modo demonstração: nada é salvo de verdade (falta preencher o config.js)</div>
<canvas id="neb" hidden aria-hidden="true"></canvas>
<main class="app">

  <!-- Cabeçalho das telas de dentro (o "FEED ⌄" do protótipo) -->
  <header id="topo" hidden>
    <button class="topo-titulo" id="topo-titulo" type="button" aria-haspopup="true" aria-expanded="false"><span id="topo-nome">FEED</span> ⌄</button>
    <span class="topo-logo">Syncthesia</span>
    <nav id="menu" hidden>
      <button type="button" data-ir="inicio">Feed</button>
      <button type="button" data-ir="adicionar">Adicionar avaliação</button>
      <button type="button" id="menu-sair">Sair</button>
    </nav>
  </header>

  <!-- ENTRAR -->
  <section id="tela-entrar" hidden>
    <div class="logo">Syncthesia</div>
    <h1 class="titulo">Entrar</h1>
    <form class="painel" id="form-entrar" novalidate>
      <div class="msg erro" id="erro-entrar" hidden></div>
      <input class="campo" id="entrar-email" type="email" placeholder="E-mail" autocomplete="email" required>
      <input class="campo" id="entrar-senha" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button class="botao" type="submit">Entrar</button>
    </form>
    <button class="link" id="ir-cadastro" type="button">Não tem conta? <u>Criar conta</u></button>
  </section>

  <!-- CRIAR CONTA -->
  <section id="tela-cadastro" hidden>
    <button class="voltar" id="voltar-entrar" type="button" aria-label="Voltar"><span class="icone i-voltar"></span></button>
    <h1 class="titulo">Criar conta</h1>
    <form class="painel" id="form-cadastro" novalidate>
      <div class="msg erro" id="erro-cadastro" hidden></div>
      <div class="msg ok" id="ok-cadastro" hidden></div>
      <input class="campo" id="cad-email" type="email" placeholder="E-mail" autocomplete="email" required>
      <input class="campo" id="cad-senha" type="password" placeholder="Senha (mínimo 8 caracteres)" autocomplete="new-password" required>
      <label class="marcar"><input type="checkbox" id="cad-idade"> <span>Declaro que tenho 18 anos ou mais.</span></label>
      <button class="botao" type="submit">Criar conta</button>
    </form>
  </section>

  <!-- CRIAR PERFIL (primeiro acesso) -->
  <section id="tela-perfil" hidden>
    <h1 class="titulo">Seu perfil</h1>
    <div class="capa">
      <div class="banner" id="previa-banner"></div>
      <div class="foto" id="previa-foto">?</div>
    </div>
    <form class="painel" id="form-perfil" novalidate>
      <div class="msg erro" id="erro-perfil" hidden></div>
      <div class="arquivo">
        <label>Foto <input type="file" id="arq-foto" accept="image/jpeg,image/png,image/webp"></label>
        <label>Banner <input type="file" id="arq-banner" accept="image/jpeg,image/png,image/webp"></label>
      </div>
      <label class="rotulo" for="perfil-nome">Nome de usuário</label>
      <input class="campo" id="perfil-nome" placeholder="ex.: maria_musica" maxlength="20" autocomplete="off">
      <div class="dica">3 a 20 caracteres: letras, números, _ e ponto.</div>
      <label class="rotulo" for="perfil-bio">Bio (opcional)</label>
      <textarea class="campo" id="perfil-bio" maxlength="200" placeholder="Conte um pouco sobre seu gosto musical"></textarea>
      <button class="botao" type="submit">Salvar perfil</button>
    </form>
  </section>

  <!-- INÍCIO = FEED -->
  <section id="tela-inicio" hidden>
    <div class="msg ok" id="aviso-inicio" hidden></div>
    <div class="abas" role="tablist" aria-label="Abas do feed">
      <button class="aba" type="button" role="tab" data-aba="global">Global</button>
      <button class="aba" type="button" role="tab" data-aba="seguidos">Seguidos</button>
      <button class="aba aba-hit" type="button" role="tab" data-aba="hit">HIT</button>
    </div>
    <div id="feed"></div>
    <div class="dica vazio" id="feed-aviso" hidden></div>
    <button class="botao cinza" id="feed-mais" type="button" hidden>Carregar mais</button>
  </section>

  <!-- ADICIONAR AVALIAÇÃO -->
  <section id="tela-adicionar" hidden>
    <div class="busca">
      <input class="campo" id="busca-q" placeholder="Busque a música" maxlength="100" autocomplete="off">
      <button type="button" id="busca-ir" aria-label="Buscar"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    </div>
    <div class="dica" id="busca-aviso" hidden></div>
    <div id="resultados"></div>

    <h2 class="subtitulo">Escolha 3 cores diferentes:</h2>
    <div class="cores"><div id="cor-a"></div><div id="cor-b"></div><div id="cor-c"></div></div>
    <div class="dica" id="dica-cores"></div>

    <div class="painel nota">
      <div class="estrelas" id="estrelas" role="slider" tabindex="0" aria-label="Nota" aria-valuemin="0" aria-valuemax="5" aria-valuestep="0.5" aria-valuenow="0"></div>
      <div class="nota-valor" id="nota-valor"></div>
      <textarea class="campo" id="critica" maxlength="2000" placeholder="Opiniões sobre a música? (opcional)"></textarea>
    </div>

    <div class="msg erro" id="erro-adicionar" hidden></div>
    <div class="dica" id="dica-envio" style="text-align:center"></div>
    <button class="botao" id="enviar-av" type="button" disabled>Submeter</button>
    <button class="link" id="cancelar-av" type="button">ou <u>Cancelar</u></button>
  </section>

  <!-- TELA DA AVALIAÇÃO (abre ao clicar num cartão do feed) -->
  <section id="tela-avaliacao" hidden>
    <div class="topo-av">
      <button class="voltar" id="av-voltar" type="button" aria-label="Voltar ao feed"><span class="icone i-voltar"></span></button>
      <span class="topo-logo">Syncthesia</span><span class="espaco-av"></span>
    </div>
    <div class="cartao-av">
      <div class="capa-av" id="av-capa"></div>
      <h2 id="av-titulo"></h2>
      <p class="sub2" id="av-sub"></p>
      <div id="av-estrelas"></div>
      <div class="player">
        <button class="play grande" id="av-play" type="button" aria-label="Tocar prévia de 30 segundos" disabled>▶</button>
        <div class="barra"><i id="av-prog"></i></div>
        <span id="av-tempo">0:00 / 0:30</span>
      </div>
      <p class="dica" id="av-aviso" style="margin:6px 4px"></p>
      <div class="cores-av" id="av-cores"></div>
      <div class="quem"><b id="av-autor"></b><span id="av-quando"></span></div>
      <p class="texto-av" id="av-critica"></p>
    </div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<button id="fab-add" type="button" aria-label="Adicionar avaliação" hidden>+</button>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/pickr.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
