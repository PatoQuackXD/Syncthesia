<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Busca YouTube + Cores</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css">
</head>
<body>
  <div class="container">
    <h2>Pesquisar música no YouTube</h2>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Digite o nome da música">
      <button id="searchBtn" type="button">Buscar</button>
    </div>
    <div id="results"></div>

    <h3>Escolha 3 cores diferentes:</h3>
    <div class="color-group">
      <div id="cor1" class="color-picker"></div>
      <div id="cor2" class="color-picker"></div>
      <div id="cor3" class="color-picker"></div>
    </div>

    <button id="submitBtn" disabled>Submeter</button>
    <div id="confirmacao"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
