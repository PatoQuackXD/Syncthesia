<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Syncthesia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Pesquisa da música pelo YouTube</h2>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Digite o nome da música">
      <button id="searchBtn" type="button">Buscar</button>
    </div>
    <div id="results"></div>

    <h3>Escolha 3 cores diferentes:</h3>
    <div class="color-group">
      <input type="color" id="cor1">
      <input type="color" id="cor2">
      <input type="color" id="cor3">
    </div>

    <button id="submitBtn" disabled>Submeter</button>
    <div id="confirmacao"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
